<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
    <link rel="stylesheet" href="contact.css">

    <!-- Pasting FontAwesome CDN link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer"/> 

    <!-- Pasting Animate.css link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body style="background-image: url('https://img.freepik.com/free-vector/pastel-gradient-cover-design-background_1048-18097.jpg?semt=ais_hybrid');background-position: center;background-size: cover;">
    <div class="link animate_animated animate__shakeX">
        <span>
            <i class="fa-solid fa-house"></i>
        </span>
        <a href="index.html">Home</a>
    </div>

    <!-- Creating contact form -->
    <div class="container animate_animated animate__flipInY">
        <h1 class="animate_animated animate__heartBeat">Registration</h1>
        
        <form action="">
            <div class="boxes">
                <div>
                    <input type="text" placeholder="First Name">
                </div>
                <div>
                    <input type="email" placeholder="Enter your email">
                </div>
                <div>
                    <textarea placeholder="(Specify your requirements)"></textarea>
                </div>
                <div class="button">
                    <input type="submit" value="REGISTER">
                </div>
            </div>
        </form>
    </div>

</body>
</html>
