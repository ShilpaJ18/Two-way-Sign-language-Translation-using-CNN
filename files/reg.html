<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reg.css">
</head>
<body style="background-image: url('https://mir-s3-cdn-cf.behance.net/projects/404/e5ff88156961289.Y3JvcCwxMjgwLDEwMDEsMCwxMzk.jpg');background-position: center;background-size: cover;">
    <div class ="reg">
        <form action=" ">
        <h1>Registration form</h1>
        <hr>
        <div>
            <input type="text" placeholder="First Name">
        </div>
        <div>
            <input type="text" placeholder="Last Name">
        </div>
        <div>
        <label>Select your Gender</label><br>
        

        <label for="#m">Male</label>
        <input type="radio" id="m" name="Gender" checked value="Male">
        <label for="#fm">female</label>
        <input type="radio" id="fm" name="Gender" checked value="female">
        <label for="#o">others</label>
        <input type="radio" id="o" name="Gender" checked value="others">
        </div>
        <div>
        <label>Languages known</label><br><br>
        <label for="#kan">kannada</label>
        <input type="checkbox" id="kan" value="kannada">
        <label for="#hin">Hindi</label>
        <input type="checkbox" id="hin" value="Hindi">
        <label for="#ta">Tamil</label>
        <input type="checkbox" id="ta" value="Tamil">
        <label for="#te">Telugu</label>
        <input type="checkbox" id="te" value="Telugu">
        </div>
        <div>
            <input type="email" placeholder="enter email">
        </div>
        <div>
            <input type="submit" value="Register">
        </div>
        </form>
    </div>
    <br><br>
    <a href="registerlink.html" target="_blank">
        Click for back to homepage
    </a>
    
</body>
</html>
