<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-image:url('https://www.tbsnews.net/sites/default/files/styles/big_2/public/images/2023/08/20/366819207_277195471695432_1074777016676104796_n.jpg');background-size: cover; height: 700px; width: 500px;">
    
    <h1><marquee>BANK REGISTRATION FORMS</marquee></h1>
   
    <form action=" ">
        <h1>Personal Information</h1>
        <hr>
        <label for="#fn">First Name</label><br>
        <input type="text" id="fn" maxlength="=20" autofocus><br><br>
        <label for="#ln">Last Name</label><br>
        <input type="text" id="ln" maxlength="10" autofocus><br><br>
        <input type="number" placeholder="number" min="10" ><br><br>
        <input type="email" placeholder="Enter email"><br><br>
        <input type ="text" placeholder="enter PAN number"><br><br>
        <label for="#dob">enter your Date Of Birth</label> 
        <input type="date" id="dob" ><br><br>
        <label>Select your Gender</label><br>
        

        <label for="#m">Male</label>
        <input type="radio" id="m" name="Gender" checked value="Male">
        <label for="#fm">female</label>
        <input type="radio" id="fm" name="Gender" checked value="female">
        <label for="#o">others</label>
        <input type="radio" id="o" name="Gender" checked value="others">

        <br><br>

        <h1>Family Information</h1>
        <hr>
        <label for="#ffn">Father name</label><br>
        <input type="text" id="ffn" maxlength="20" autofocus><br><br>
        <label for="#mn">Mother name</label><br>
        <input type="text" id="mn" maxlength="20" autofocus><br><br>
        <label for="#ad">Enter Address</label><br>
        <input type="text" id="ad" maxlength="100" autofocus><br><br>
        <label>Languages known</label><br><br>
        <label for="#kan">kannada</label>
        <input type="checkbox" id="kan" value="kannada">
        <label for="#hin">Hindi</label>
        <input type="checkbox" id="hin" value="Hindi">
        <label for="#ta">Tamil</label>
        <input type="checkbox" id="ta" value="Tamil">
        <label for="#te">Telugu</label>
        <input type="checkbox" id="te" value="Telugu"><br><br>
        <label for="#hm">Home Ownership Status</label><br>
        <input type="text" id="hm" maxlength="19" autofocus><br><br>

        <h1>Bank account information</h1>
        <hr>

        <input type="number" placeholder=" account number" min="15" ><br><br>
        <label for="#bk">Bank Name</label><br>
        <input type="text" id="bk" maxlength="15" autofocus><br><br>
        <label for="#ba">Bank Address</label><br>
        <input type="text" id="ba" maxlength="105" autofocus><br><br>

        <label>Account type</label><br><br>
        <label for="#sv">Saving</label>
        <input type="radio" name="Account type" checked value="Saving">
        <label for="#st">Student</label>
        <input type="radio" name="Account type" checked value="Student">
        <label for="#bs">Business</label>
        <input type="radio" name="Account type" checked value="Business"><br><br>
        <label for="#roip">Rate Of Intrest</label>
        <input type ="text" value="10% PA" id="roip" disabled><br><br>
        
        <label for = "Documents">upload your aadhar card</label>
        <input type="file" id="Documents" single><br><br>

        <h1>Calculations</h1>
        <hr>
        <input type="number" placeholder="Account Balance :" min="25" ><br><br>
        <input type="number" placeholder="Deposit :" min="500" ><br><br>
         
        <label for="account-opening-month">Account Opening Month:</label>
        <input type="month" id="account-opening-month"  required>
        <br><br>

        <label for="transaction-week">Transaction Week:</label>
        <input type="week" id="transaction-week" required>
        <br><br>

        <button type ="submit" >submit</button>













    </form>
</form>
</body>
</html>
